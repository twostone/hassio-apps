name: Essensplanung
version: 0.17.0
slug: essensplanung
description: "W\xF6chentliche Essensplanung f\xFCr den Haushalt"
url: https://github.com/twostone/meal-planner
homeassistant: 2026.10.1
arch:
- aarch64
- amd64
image: ghcr.io/twostone/meal-planner
ingress: true
panel_icon: mdi:silverware-fork-knife
panel_title: Essensplanung
panel_admin: false
homeassistant_api: true
discovery:
- meal_planner
ports:
  8101/tcp: null
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
  ai_entity_recipe: match(^ai_task\.[a-z0-9_]+$)?
  ai_entity_titles: match(^ai_task\.[a-z0-9_]+$)?
  ai_entity_image: match(^ai_task\.[a-z0-9_]+$)?
  mcp_app_url: url?
  mcp_ha_url: url?
